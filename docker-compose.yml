# =============================================================================
# TESA Defence AI – Docker Compose
# =============================================================================
# Usage:
#   docker compose up              → Start dashboard (CPU)
#   docker compose up dashboard    → Start dashboard only
#   docker compose run cli         → Interactive CLI
#   docker compose --profile gpu up → Start with GPU support
# =============================================================================

services:
  # -------------------------------------------------------------------------
  # Dashboard (Streamlit) – CPU
  # -------------------------------------------------------------------------
  dashboard:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: tesa-dashboard
    ports:
      - "${STREAMLIT_SERVER_PORT:-8501}:8501"
    volumes:
      # Mount videos & output folders for persistence
      - ./videos:/app/videos:ro
      - ./outputs:/app/outputs
      - ./submissions:/app/submissions
      # Optional: mount .env for runtime config
      - ./.env:/app/.env:ro
    env_file:
      - path: .env
        required: false
    environment:
      - STREAMLIT_SERVER_HEADLESS=true
      - STREAMLIT_BROWSER_GATHER_USAGE_STATS=false
      - PYTHONUNBUFFERED=1
      - PYTHONIOENCODING=utf-8
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8501/_stcore/health')"]
      interval: 30s
      timeout: 10s
      retries: 3

  # -------------------------------------------------------------------------
  # CLI (Interactive)
  # -------------------------------------------------------------------------
  cli:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: tesa-cli
    stdin_open: true
    tty: true
    entrypoint: ["python", "cli.py"]
    volumes:
      - ./videos:/app/videos:ro
      - ./outputs:/app/outputs
      - ./submissions:/app/submissions
      - ./.env:/app/.env:ro
    env_file:
      - path: .env
        required: false
    environment:
      - PYTHONUNBUFFERED=1
      - PYTHONIOENCODING=utf-8
    profiles:
      - cli

  # -------------------------------------------------------------------------
  # Dashboard with GPU (NVIDIA)
  # -------------------------------------------------------------------------
  dashboard-gpu:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        BASE_IMAGE: nvidia/cuda:12.4.1-runtime-ubuntu22.04
    container_name: tesa-dashboard-gpu
    ports:
      - "${STREAMLIT_SERVER_PORT:-8501}:8501"
    volumes:
      - ./videos:/app/videos:ro
      - ./outputs:/app/outputs
      - ./submissions:/app/submissions
      - ./.env:/app/.env:ro
    env_file:
      - path: .env
        required: false
    environment:
      - STREAMLIT_SERVER_HEADLESS=true
      - STREAMLIT_BROWSER_GATHER_USAGE_STATS=false
      - PYTHONUNBUFFERED=1
      - PYTHONIOENCODING=utf-8
      - NVIDIA_VISIBLE_DEVICES=all
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    restart: unless-stopped
    profiles:
      - gpu
