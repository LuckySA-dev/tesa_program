name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Syntax check (all source files)
        run: |
          python -m py_compile dashboard.py
          python -m py_compile cli.py
          python -m py_compile test_pipeline_short.py
          for f in src/*.py; do python -m py_compile "$f"; done

      - name: Import check (core modules)
        run: |
          cd src
          python -c "from hw import sprint, get_device, system_summary; print('hw OK')"
          python -c "from config import MODEL_CONFIG, API_CONFIG; print('config OK')"
          python -c "from api_client import create_client, available_protocols; print('api_client OK:', available_protocols())"

      - name: API real-world test (mock + REST)
        run: |
          cd src
          python test_api_real.py

  docker:
    runs-on: ubuntu-latest
    needs: lint-and-test

    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - name: Build Docker image
        run: docker build -t tesa-defence .

      - name: Verify container starts
        run: |
          docker run -d --name tesa-test -p 8501:8501 tesa-defence
          sleep 10
          curl -f http://localhost:8501/_stcore/health || exit 1
          docker logs tesa-test
          docker stop tesa-test
